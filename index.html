<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OliPixel Card Packs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .nav-menu a.active {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .user-credits {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .main-content {
            margin-top: 80px;
            padding: 40px 20px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .auth-screen {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4ecdc4;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1em;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .section-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
        }

        .pack-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .pack {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
        }

        .pack:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(78, 205, 196, 0.3);
        }

        .pack-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .pack-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .pack-price {
            font-size: 1.5em;
            color: #4ecdc4;
            margin: 20px 0;
        }

        .pack-btn {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .inventory-item-emoji {
            font-size: 4em;
            margin: 10px 0;
        }

        .inventory-item-name {
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px 0;
        }

        .inventory-item-count {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            display: inline-block;
            margin: 8px 0;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .cards-reveal {
            display: none;
            padding: 40px 20px;
        }

        .cards-reveal.active { display: block; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: #333;
        }

        .card.rare { background: linear-gradient(145deg, #ff6b6b, #ee5a6f); color: white; }
        .card.epic { background: linear-gradient(145deg, #a855f7, #6366f1); color: white; }
        .card.legendary { background: linear-gradient(145deg, #f59e0b, #d97706); color: white; }

        .card-image { font-size: 80px; margin: 20px 0; }
        .card-name { font-size: 1.4em; font-weight: bold; margin: 10px 0; }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            margin: 10px;
        }

        .btn-primary { background: linear-gradient(145deg, #10b981, #059669); }
        .btn-secondary { background: linear-gradient(145deg, #6366f1, #4f46e5); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🎮 OliPixel Cards</div>
            <ul class="nav-menu">
                <li><a class="active" onclick="showPacks()">Packs</a></li>
                <li><a onclick="showInventory()">Inventaire</a></li>
            </ul>
            <div id="navAuth">
                <button class="btn-submit" onclick="showLogin()" style="padding: 10px 25px;">Connexion</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <!-- Login -->
        <div id="loginScreen" class="auth-screen">
            <div class="auth-card">
                <h2 style="text-align: center; margin-bottom: 30px;">🎮 Connexion</h2>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-submit">Se connecter</button>
                </form>
                <p style="text-align: center; margin-top: 20px;">
                    <a onclick="showRegister()" style="color: #4ecdc4; cursor: pointer;">Créer un compte</a>
                </p>
            </div>
        </div>

        <!-- Register -->
        <div id="registerScreen" class="auth-screen" style="display: none;">
            <div class="auth-card">
                <h2 style="text-align: center; margin-bottom: 30px;">✨ Inscription</h2>
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label>Pseudo</label>
                        <input type="text" id="regUsername" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirmer</label>
                        <input type="password" id="regPasswordConfirm" required>
                    </div>
                    <button type="submit" class="btn-submit">Créer mon compte</button>
                </form>
                <p style="text-align: center; margin-top: 20px;">
                    <a onclick="showLogin()" style="color: #4ecdc4; cursor: pointer;">Déjà un compte</a>
                </p>
            </div>
        </div>

        <!-- Game -->
        <div id="gameContent" style="display: none;">
            <!-- Packs -->
            <section id="packsSection">
                <h2 class="section-title">🎁 Packs de Cartes</h2>
                <div class="pack-container">
                    <div class="pack" onclick="openPack('basic')">
                        <div class="pack-icon">📦</div>
                        <div class="pack-name">Basique</div>
                        <div class="pack-price">💰 100</div>
                        <button class="pack-btn">Ouvrir</button>
                    </div>
                    <div class="pack" onclick="openPack('premium')">
                        <div class="pack-icon">🎁</div>
                        <div class="pack-name">Premium</div>
                        <div class="pack-price">💰 250</div>
                        <button class="pack-btn">Ouvrir</button>
                    </div>
                    <div class="pack" onclick="openPack('legendary')">
                        <div class="pack-icon">💎</div>
                        <div class="pack-name">Légendaire</div>
                        <div class="pack-price">💰 500</div>
                        <button class="pack-btn">Ouvrir</button>
                    </div>
                </div>
            </section>

            <!-- Cards Reveal -->
            <div class="cards-reveal" id="cardsReveal">
                <h2 class="section-title">🎉 Nouvelles Cartes !</h2>
                <div class="cards-grid" id="cardsGrid"></div>
                <div style="text-align: center;">
                    <button class="btn btn-primary" onclick="showPacks()">Nouveau Pack</button>
                    <button class="btn btn-secondary" onclick="showInventory()">Inventaire</button>
                </div>
            </div>

            <!-- Inventory -->
            <section id="inventorySection" style="display: none;">
                <h2 class="section-title">📋 Mon Inventaire</h2>
                <div class="inventory-grid" id="inventoryGrid"></div>
            </section>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = 'olipixelyt@gmail.com';
        let currentUser = null;
        let users = {};
        let credits = 1000;
        let inventory = [];

        const cardDatabase = {
            basic: [
                {name: 'Konohamaru', rarity: 'common', emoji: '🥷', description: 'Ninja en formation'},
                {name: 'Tanjiro', rarity: 'common', emoji: '⚔️', description: 'Pourfendeur'},
                {name: 'Usopp', rarity: 'common', emoji: '🎯', description: 'Tireur d\'élite'},
            ],
            rare: [
                {name: 'Kakashi', rarity: 'rare', emoji: '📖', description: 'Ninja copieur'},
                {name: 'Zenitsu', rarity: 'rare', emoji: '⚡', description: 'Maître foudre'},
                {name: 'Zoro', rarity: 'rare', emoji: '🗡️', description: 'Trois sabres'},
            ],
            epic: [
                {name: 'Itachi', rarity: 'epic', emoji: '🌙', description: 'Génie Uchiha'},
                {name: 'Luffy', rarity: 'epic', emoji: '👒', description: 'Futur roi'},
                {name: 'Levi', rarity: 'epic', emoji: '💨', description: 'Le plus fort'},
            ],
            legendary: [
                {name: 'Naruto', rarity: 'legendary', emoji: '🦊', description: 'Hokage'},
                {name: 'Goku', rarity: 'legendary', emoji: '💫', description: 'Ultra instinct'},
                {name: 'Eren', rarity: 'legendary', emoji: '⚡', description: 'Titan'},
            ]
        };

        window.onload = () => {
            const saved = localStorage.getItem('users');
            if (saved) users = JSON.parse(saved);
            const email = sessionStorage.getItem('currentUser');
            if (email && users[email]) {
                currentUser = users[email];
                credits = currentUser.credits;
                inventory = currentUser.inventory || [];
                showGame();
            }
        };

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('registerScreen').style.display = 'none';
            document.getElementById('gameContent').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('registerScreen').style.display = 'flex';
            document.getElementById('gameContent').style.display = 'none';
        }

        function register(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;

            if (password !== confirm) {
                showToast('Mots de passe différents', 'error');
                return;
            }
            if (users[email]) {
                showToast('Email déjà utilisé', 'error');
                return;
            }

            users[email] = {username, email, password, credits: 1000, inventory: []};
            localStorage.setItem('users', JSON.stringify(users));
            showToast('Compte créé !');
            setTimeout(() => {
                document.getElementById('loginEmail').value = email;
                showLogin();
            }, 1000);
        }

        function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!users[email] || users[email].password !== password) {
                showToast('Email ou mot de passe incorrect', 'error');
                return;
            }

            currentUser = users[email];
            credits = currentUser.credits;
            inventory = currentUser.inventory || [];
            sessionStorage.setItem('currentUser', email);
            showToast('Connexion réussie !');
            setTimeout(showGame, 500);
        }

        function showGame() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('registerScreen').style.display = 'none';
            document.getElementById('gameContent').style.display = 'block';
            
            const initial = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('navAuth').innerHTML = `
                <div class="user-profile">
                    <div class="user-avatar">${initial}</div>
                    <span>${currentUser.username}</span>
                    <div class="user-credits">💰 ${credits}</div>
                </div>
            `;
        }

        function showPacks() {
            document.getElementById('packsSection').style.display = 'block';
            document.getElementById('cardsReveal').classList.remove('active');
            document.getElementById('inventorySection').style.display = 'none';
        }

        function showInventory() {
            document.getElementById('packsSection').style.display = 'none';
            document.getElementById('cardsReveal').classList.remove('active');
            const section = document.getElementById('inventorySection');
            const grid = document.getElementById('inventoryGrid');
            
            grid.innerHTML = '';
            
            if (inventory.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Inventaire vide</p>';
            } else {
                const counts = {};
                inventory.forEach(card => {
                    if (!counts[card.name]) counts[card.name] = {card, count: 0};
                    counts[card.name].count++;
                });

                Object.values(counts).forEach(({card, count}) => {
                    const item = document.createElement('div');
                    item.className = 'inventory-item';
                    item.innerHTML = `
                        <div class="inventory-item-emoji">${card.emoji}</div>
                        <div class="inventory-item-name">${card.name}</div>
                        <div class="inventory-item-count">x${count}</div>
                        <button class="btn-delete" onclick="deleteCard('${card.name}')">🗑️ Supprimer</button>
                    `;
                    grid.appendChild(item);
                });
            }

            section.style.display = 'block';
        }

        function deleteCard(name) {
            const index = inventory.findIndex(c => c.name === name);
            if (index !== -1) {
                inventory.splice(index, 1);
                users[currentUser.email].inventory = inventory;
                localStorage.setItem('users', JSON.stringify(users));
                showToast(`Carte "${name}" supprimée`);
                showInventory();
            }
        }

        function openPack(type) {
            const costs = {basic: 100, premium: 250, legendary: 500};
            if (credits < costs[type]) {
                showToast('Pas assez de crédits !', 'error');
                return;
            }

            credits -= costs[type];
            users[currentUser.email].credits = credits;
            
            const cards = generateCards(type);
            inventory.push(...cards);
            users[currentUser.email].inventory = inventory;
            localStorage.setItem('users', JSON.stringify(users));

            displayCards(cards);
            document.getElementById('navAuth').querySelector('.user-credits').textContent = `💰 ${credits}`;
        }

        function generateCards(type) {
            const num = type === 'legendary' ? 5 : type === 'premium' ? 4 : 3;
            const cards = [];
            for (let i = 0; i < num; i++) {
                const rarity = getRarity(type);
                const pool = cardDatabase[rarity];
                cards.push({...pool[Math.floor(Math.random() * pool.length)]});
            }
            return cards;
        }

        function getRarity(type) {
            const r = Math.random();
            if (type === 'legendary') {
                if (r < 0.3) return 'legendary';
                if (r < 0.6) return 'epic';
                if (r < 0.85) return 'rare';
            } else if (type === 'premium') {
                if (r < 0.1) return 'legendary';
                if (r < 0.3) return 'epic';
                if (r < 0.65) return 'rare';
            } else {
                if (r < 0.02) return 'legendary';
                if (r < 0.1) return 'epic';
                if (r < 0.35) return 'rare';
            }
            return 'basic';
        }

        function displayCards(cards) {
            document.getElementById('packsSection').style.display = 'none';
            const reveal = document.getElementById('cardsReveal');
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            
            cards.forEach((card, i) => {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = `card ${card.rarity}`;
                    el.innerHTML = `
                        <div>${card.rarity}</div>
                        <div class="card-image">${card.emoji}</div>
                        <div class="card-name">${card.name}</div>
                        <div>${card.description}</div>
                    `;
                    grid.appendChild(el);
                }, i * 300);
            });
            
            reveal.classList.add('active');
        }
    </script>
</body>
</html>
