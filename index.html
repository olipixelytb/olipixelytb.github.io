<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack Opening - Steam Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .user-info {
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            display: inline-block;
            margin-top: 10px;
        }

        .pack-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .pack {
            width: 200px;
            height: 280px;
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pack:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,215,0,0.5);
        }

        .pack-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .pack-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            text-align: center;
            padding: 0 10px;
        }

        .pack-price {
            font-size: 1.1em;
            color: #555;
            margin-top: 10px;
        }

        .cards-reveal {
            display: none;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeIn 0.5s ease;
        }

        .cards-reveal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            width: 180px;
            height: 250px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
            animation: cardFlip 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        @keyframes cardFlip {
            0% { transform: rotateY(180deg) scale(0.5); opacity: 0; }
            100% { transform: rotateY(0) scale(1); opacity: 1; }
        }

        .card.rare {
            background: linear-gradient(145deg, #ff6b6b, #ee5a6f);
            color: white;
            border: 3px solid gold;
        }

        .card.epic {
            background: linear-gradient(145deg, #a855f7, #6366f1);
            color: white;
            border: 3px solid #fbbf24;
        }

        .card.legendary {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            color: white;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.6);
        }

        .card-rarity {
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card-image {
            font-size: 60px;
            margin: 20px 0;
        }

        .card-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(145deg, #10b981, #059669);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(16,185,129,0.4);
        }

        .btn-secondary {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(99,102,241,0.4);
        }

        .inventory {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            margin-top: 40px;
            max-width: 800px;
            width: 100%;
        }

        .inventory h2 {
            margin-bottom: 20px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .inventory-item {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Steam Card Packs</h1>
        <div class="user-info">
            <p>👤 Connecté via Steam | 💰 Crédits: <span id="credits">1000</span></p>
        </div>
    </div>

    <div class="pack-container" id="packContainer">
        <div class="pack" onclick="openPack('basic')">
            <div class="pack-icon">📦</div>
            <div class="pack-name">Pack Basique</div>
            <div class="pack-price">100 Crédits</div>
        </div>
        <div class="pack" onclick="openPack('premium')" style="background: linear-gradient(145deg, #a855f7, #c084fc);">
            <div class="pack-icon">🎁</div>
            <div class="pack-name">Pack Premium</div>
            <div class="pack-price">250 Crédits</div>
        </div>
        <div class="pack" onclick="openPack('legendary')" style="background: linear-gradient(145deg, #f59e0b, #fbbf24);">
            <div class="pack-icon">💎</div>
            <div class="pack-name">Pack Légendaire</div>
            <div class="pack-price">500 Crédits</div>
        </div>
    </div>

    <div class="cards-reveal" id="cardsReveal"></div>

    <div class="buttons" id="buttons" style="display: none;">
        <button class="btn btn-primary" onclick="resetPacks()">Ouvrir un autre pack</button>
        <button class="btn btn-secondary" onclick="showInventory()">Voir mon inventaire</button>
    </div>

    <div class="inventory" id="inventory" style="display: none;">
        <h2>📋 Mon Inventaire</h2>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <script>
        let credits = 1000;
        let inventory = [];

        const cardDatabase = {
            basic: [
                {name: 'Carte Commune', rarity: 'common', emoji: '🃏', description: 'Une carte basique'},
                {name: 'Soldat', rarity: 'common', emoji: '⚔️', description: 'Défenseur loyal'},
                {name: 'Archer', rarity: 'common', emoji: '🏹', description: 'Tireur précis'},
            ],
            rare: [
                {name: 'Chevalier', rarity: 'rare', emoji: '🛡️', description: 'Guerrier noble'},
                {name: 'Mage', rarity: 'rare', emoji: '🔮', description: 'Maître des arcanes'},
                {name: 'Voleur', rarity: 'rare', emoji: '🗡️', description: 'Ombre furtive'},
            ],
            epic: [
                {name: 'Dragon', rarity: 'epic', emoji: '🐉', description: 'Bête mythique'},
                {name: 'Phénix', rarity: 'epic', emoji: '🔥', description: 'Oiseau immortel'},
            ],
            legendary: [
                {name: 'Titan', rarity: 'legendary', emoji: '👑', description: 'Être suprême'},
                {name: 'Dieu Ancien', rarity: 'legendary', emoji: '⚡', description: 'Puissance ultime'},
            ]
        };

        function openPack(packType) {
            const costs = {basic: 100, premium: 250, legendary: 500};
            const cost = costs[packType];

            if (credits < cost) {
                alert('Pas assez de crédits !');
                return;
            }

            credits -= cost;
            document.getElementById('credits').textContent = credits;

            const cards = generateCards(packType);
            displayCards(cards);
            inventory.push(...cards);

            document.getElementById('packContainer').style.display = 'none';
            document.getElementById('buttons').style.display = 'flex';
        }

        function generateCards(packType) {
            const numCards = packType === 'legendary' ? 5 : packType === 'premium' ? 4 : 3;
            const cards = [];

            for (let i = 0; i < numCards; i++) {
                const rarity = getRandomRarity(packType);
                const pool = cardDatabase[rarity];
                const card = pool[Math.floor(Math.random() * pool.length)];
                cards.push({...card});
            }

            return cards;
        }

        function getRandomRarity(packType) {
            const rand = Math.random();
            
            if (packType === 'legendary') {
                if (rand < 0.3) return 'legendary';
                if (rand < 0.6) return 'epic';
                if (rand < 0.85) return 'rare';
                return 'basic';
            } else if (packType === 'premium') {
                if (rand < 0.1) return 'legendary';
                if (rand < 0.3) return 'epic';
                if (rand < 0.65) return 'rare';
                return 'basic';
            } else {
                if (rand < 0.02) return 'legendary';
                if (rand < 0.1) return 'epic';
                if (rand < 0.35) return 'rare';
                return 'basic';
            }
        }

        function displayCards(cards) {
            const container = document.getElementById('cardsReveal');
            container.innerHTML = '';
            container.classList.add('active');

            cards.forEach((card, index) => {
                setTimeout(() => {
                    const cardEl = document.createElement('div');
                    cardEl.className = `card ${card.rarity}`;
                    cardEl.innerHTML = `
                        <div class="card-rarity">${card.rarity}</div>
                        <div class="card-image">${card.emoji}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-description">${card.description}</div>
                    `;
                    container.appendChild(cardEl);
                }, index * 300);
            });
        }

        function resetPacks() {
            document.getElementById('packContainer').style.display = 'flex';
            document.getElementById('cardsReveal').classList.remove('active');
            document.getElementById('buttons').style.display = 'none';
            document.getElementById('inventory').style.display = 'none';
        }

        function showInventory() {
            const invEl = document.getElementById('inventory');
            const gridEl = document.getElementById('inventoryGrid');
            
            gridEl.innerHTML = '';
            inventory.forEach(card => {
                const item = document.createElement('div');
                item.className = 'inventory-item';
                item.innerHTML = `${card.emoji}<br>${card.name}`;
                gridEl.appendChild(item);
            });

            invEl.style.display = 'block';
        }
    </script>
</body>
</html>
